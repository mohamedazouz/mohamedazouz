version: 2
updates:
  # JS dependencies (Bun lockfile). Never propose a release younger than 30 days —
  # matches minimumReleaseAge in bunfig.toml.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 30
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
    commit-message:
      prefix: chore(deps)

  # GitHub Actions (pinned by SHA)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 30
    commit-message:
      prefix: ci(deps)
